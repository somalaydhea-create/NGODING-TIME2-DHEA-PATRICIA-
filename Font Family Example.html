<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Font Family Example</title>

<style type="text/css">
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #21152f, #49345f, #8d78a8);
        font-family: Times;
        color: #352747;
    }

    .container {
        width: 100%;
        max-width: 800px;
        padding: 35px;
        background: #fbf8ff;
        border: 1px solid #d9cbea;
        border-radius: 22px;
        box-shadow: 0 20px 45px rgba(15, 8, 25, 0.3);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 25px;
        color: #67458a;
        text-align: center;
        font-size: 32px;
    }

    div {
        font-size: 14pt;
        line-height: 150%;
        font-family: Arial ! important;
        padding: 20px;
        background: #eee5fa;
        border: 1px solid #d3c0ed;
        border-radius: 12px;
        margin-bottom: 18px;
    }

    #div1 {
        font-family: Sans-Serif;
        background: #e2d5f3;
        border-left: 6px solid #9873c5;
    }

    /* all divs, no matter how used, will be in Arial, see !important */
</style>
</head>

<body>
<div class="container">
    <h1>Font Family Example</h1>

    <div>
        This text uses Arial because of the !important rule.
    </div>

    <div id="div1">
        This text also uses Arial because !important overrides the ID selector.
    </div>
</div>
</body>
</html>
