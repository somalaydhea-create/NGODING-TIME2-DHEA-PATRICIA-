<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .table-container {
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        table {
            border-collapse: collapse;
            width: 600px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        caption {
            padding: 15px;
            font-size: 25px;
            font-weight: bold;
            color: #4a3f8c;
            caption-side: top;
        }

        td {
            padding: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border: 1px solid #ddd;
            transition: 0.3s ease;
        }

        td:hover {
            background: #eef0ff;
            color: #667eea;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <div class="table-container">

        <table border="1">

            <caption align="top">Our High-Priced Menu</caption>

            <tr>

                <td>Escargot</td>

                <td>Filet Mignon</td>

                <td>Big Mac</td>

            </tr>

        </table>

    </div>

</body>
</html>
