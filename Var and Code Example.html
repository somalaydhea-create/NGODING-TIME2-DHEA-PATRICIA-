
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Var and Code Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(
                135deg,
                #101010,
                #202820,
                #303d32
            );
        }

        .card {
            width: 100%;
            max-width: 800px;
            padding: 45px;
            background: #181d19;
            border: 1px solid #455a48;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: 0.3s ease;
        }

        p {
            color: #e4e9e4;
            font-size: 21px;
            line-height: 2;
            text-align: center;
        }

        var {
            color: #b8ff6a;
            font-family: Consolas, monospace;
            font-weight: bold;
            font-style: italic;
            background: rgba(184, 255, 106, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }

        code {
            display: inline-block;
            padding: 5px 10px;
            margin: 3px;
            color: #a8ffb0;
            background: #0d130f;
            border: 1px solid #344a38;
            border-radius: 7px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 17px;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(120, 255, 140, 0.05);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #b8ff6a;
            box-shadow: 0 20px 50px rgba(120, 255, 140, 0.12);
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 18px;
            }

            p {
                font-size: 17px;
            }

            code {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <p>To increment a variable <var>count</var>, use
        <code> count++ </code> or <code> count = count + 1 </code>.</p>
    </div>

</body>
</html>
