
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cite Element Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(
                135deg,
                #f3e5d0,
                #d8b98c,
                #b8895b
            );
        }

        .card {
            width: 100%;
            max-width: 750px;
            padding: 50px 45px;
            background: #fffaf0;
            border: 1px solid #c9a66b;
            border-radius: 8px;
            box-shadow: 0 20px 45px rgba(77, 47, 25, 0.25);
            position: relative;
            transition: 0.3s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(176, 129, 65, 0.35);
            pointer-events: none;
        }

        .card p {
            position: relative;
            color: #493321;
            font-size: 24px;
            line-height: 1.9;
            text-align: center;
        }

        cite {
            color: #98652e;
            font-weight: bold;
            font-style: italic;
            text-decoration: underline;
            text-decoration-color: #c9a66b;
            text-underline-offset: 5px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 55px rgba(77, 47, 25, 0.3);
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            .card p {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <p>This example is taken from <cite>HTML &amp; CSS: The Complete
        Reference</cite> a book by Thomas Powell.</p>
    </div>

</body>
</html>
