<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbreviation Example</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Verdana, sans-serif;

            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
        }

        .container {
            width: 500px;
            padding: 40px;

            background-color: white;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h1 {
            margin-top: 0;

            color: #4f46e5;

            font-size: 32px;
        }

        p {
            padding: 15px;

            margin: 15px 0;

            background-color: #f8fafc;

            border-left: 5px solid #6366f1;

            border-radius: 8px;

            color: #444;

            font-size: 18px;

            line-height: 1.6;
        }

        abbr {
            color: #4f46e5;

            font-weight: bold;

            text-decoration: underline dotted;

            cursor: help;
        }

        abbr:hover {
            color: #ec4899;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Abbreviation Examples</h1>

        <p>
            <abbr title="California">Calif</abbr>
        </p>

        <p>
            Isn't <abbr>WWW</abbr> an acronym? Oh what trouble!
        </p>

    </div>

</body>
</html>
