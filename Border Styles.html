<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Border Styles</title>

<style type="text/css">
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 30px;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #29213b, #51416d, #a18ab5);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 750px;
        padding: 35px;
        background: #fffaf4;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    p {
        border-style: solid;
        border-width: thin;
        border-color: blue;
        padding: 25px;
        margin: 20px 0;
        background: #f5f0ff;
        color: #352b48;
        border-radius: 8px;
        font-size: 18px;
        min-height: 80px;
    }

    #d1 {
        border-style: double;
        border-color: #0000EE;
        border-width: 5px;
        background: #ece8ff;
    }

    #rainbow {
        border-color: red green blue orange;
        border-width: 5px;
        background: #fff0e7;
    }

    @media (max-width: 500px) {
        body {
            padding: 16px;
        }

        .container {
            padding: 20px;
        }
    }
</style>
</head>

<body>
<div class="container">
    <p></p>
    <p id="d1"></p>
    <p id="rainbow"></p>
</div>
</body>
</html>
