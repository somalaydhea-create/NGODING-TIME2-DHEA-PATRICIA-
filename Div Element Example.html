<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Element Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b2920, #a65f35, #f2c078);
        }

        .page {
            width: 100%;
            max-width: 800px;
            padding: 35px;
            background: #fffaf2;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(40, 20, 10, 0.3);
        }

        .justify-box {
            padding: 22px;
            margin-bottom: 22px;
            background: #f5e7d3;
            border-left: 6px solid #c47a3c;
            border-radius: 10px;
            text-align: justify;
            line-height: 1.8;
            color: #503626;
        }

        .special {
            padding: 22px;
            margin-bottom: 22px;
            background-color: yellow;
            border: 2px solid #e4a72d;
            border-radius: 12px;
            color: #4b3216;
            line-height: 1.8;
            box-shadow: 0 8px 18px rgba(150, 100, 20, 0.12);
            transition: 0.3s ease;
        }

        .special:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(150, 100, 20, 0.2);
        }

        .container {
            padding: 20px;
            background: #ead5bd;
            border: 2px dashed #b57b50;
            border-radius: 14px;
        }

        .wrapper {
            padding: 18px;
            background: #d4a373;
            border-radius: 10px;
        }

        .content {
            padding: 22px;
            background: #fffaf2;
            border-left: 5px solid #8c4a2f;
            border-radius: 8px;
            color: #603b2a;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .content:hover {
            background: #fff0dc;
            padding-left: 30px;
        }

        @media (max-width: 600px) {
            .page {
                padding: 20px;
            }

            .justify-box,
            .special {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <div class="justify-box" align="justify">
            <!-- IE syntax -->
            All text within this division will be justified
        </div>

        <div class="special" id="div1" style="background-color: yellow;">
            Divs are useful for setting arbitrary style
        </div>

        <div class="container">
            <div class="wrapper">
                <div class="content">
                    <p>I have divitis</p>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
