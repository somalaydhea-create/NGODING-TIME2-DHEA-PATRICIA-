<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Example</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ea6866, #764ba2);
        }

        .card {
            width: 380px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .card::before {
            content: "📍";
            display: block;
            font-size: 45px;
            margin-bottom: 15px;
        }

        address {
            font-style: normal;
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            letter-spacing: 0.5px;
        }

        address br {
            line-height: 1.8;
        }

        address::first-line {
            font-weight: bold;
            color: #66d6ea;
        }

        address:hover {
            transform: scale(1.02);
            transition: 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="card">
        <address>PINT, Inc.<br> 
        2105 Garnet Ave.<br> 
        San Diego, CA 92109<br> 
        U.S.A.</address>
    </div>

</body>
</html>
