<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acronym Example</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Verdana, sans-serif;

            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }

        .container {
            width: 600px;
            padding: 45px;

            background-color: #ffffff;

            border-radius: 20px;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;

            color: #4f46e5;

            font-size: 32px;
        }

        p {
            padding: 25px;

            background-color: #f8fafc;

            border-radius: 12px;

            color: #444444;

            font-size: 22px;

            line-height: 1.8;
        }

        acronym {
            color: #4f46e5;

            font-weight: bold;

            text-decoration: underline dotted;

            cursor: help;

            padding: 5px 10px;

            border-radius: 6px;

            transition: 0.3s;
        }

        acronym:hover {
            color: #ffffff;

            background-color: #6366f1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Acronym Example</h1>

        <p>
            <acronym title="Extensible Markup Language">XML</acronym> 
            <acronym lang="fr" title="Soci&eacute;t&eacute; Nationale de Chemins de 
            Fer">SNCF</acronym>
        </p>

    </div>

</body>
</html>
