<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Map Example</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 850px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 30px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .image-box {
            padding: 15px;
            border-radius: 20px;
            background: #f5f5f5;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .image-box img {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #eee;
            color: #444;
        }

        .info strong {
            color: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Image Map</h1>

        <div class="description">
            Klik pada bagian gambar yang memiliki area tertentu.
        </div>

        <div class="image-box">

            <img src="c:\Users\acer\Downloads\tugu_kujang_bogor.jpeg" alt="Image Map" usemap="#primary">

            <map id="primary" name="primary"> 
                <area shape="circle" coords="200,250,25" href="another.html"> 
                <area shape="default" nohref> 
            </map> 

            <!-- XHTML syntax --> 
            <map id="secondary" name="secondary"> 
                <area shape="rect" coords="10,10,100,100" href="another.html" /> 
                <area shape="default" nohref="nohref" /> 
            </map>

        </div>

        <div class="info">
            <strong>Image Map:</strong> bagian tertentu dari gambar dapat dijadikan area yang bisa diklik.
        </div>

    </div>

</body>
</html>
