<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Test File</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #151515, #292929, #472515);
}

h1 {
    margin-bottom: 25px;
    color: #ff8c42;
    font-size: 48px;
    letter-spacing: 3px;
    text-shadow: 0 0 18px rgba(255, 140, 66, 0.25);
}

p {
    color: #eeeeee;
    font-size: 20px;
    line-height: 1.8;
}

strong {
    color: #ffb36b;
    font-weight: 800;
    text-decoration: underline;
    text-decoration-color: #ff8c42;
    text-underline-offset: 5px;
}

@media (max-width: 480px) {
    h1 {
        font-size: 38px;
    }

    p {
        font-size: 17px;
    }
}
</style>
</head>

<body>
<h1>Test</h1>
<p>This is a <strong>Test</strong>!</p>
</body>
</html>
