<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Linked Styles</title>

<style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #191919, #343434, #626262);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
    }

    #page {
        width: 100%;
        max-width: 850px;
        padding: 50px;
        background: #fdfaf5;
        border-radius: 18px;
        border: 1px solid #d6c7b2;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    }

    h1 {
        color: #8b4513;
        font-size: clamp(28px, 5vw, 42px);
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 3px solid #c49a6c;
    }

    p {
        color: #49413c;
        font-size: 18px;
        line-height: 1.9;
    }

    a {
        color: #b05a30;
        font-weight: bold;
        text-decoration: none;
        border-bottom: 2px solid #d9a066;
        transition: 0.3s ease;
    }

    a:hover {
        color: #702f18;
        border-bottom-color: #702f18;
    }

    @media (max-width: 500px) {
        #page {
            padding: 25px;
        }

        p {
            font-size: 16px;
        }
    }
</style>

</head>
<body>
<div id="page">
<h1>HTML with Linked Style</h1>
<p>Cascading Style Sheets 2.1 as defined by the
<a href="http://www.w3.org">W3C</a> provides
powerful page layout facilities. The technology
depends on correct markup so make sure
you get that right too!</p>
</div>
</body>
</html>
