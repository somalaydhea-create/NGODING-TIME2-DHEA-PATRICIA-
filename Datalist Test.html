<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datalist Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071426, #12365a, #0f172a);
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(125, 211, 252, 0.3);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 30px;
            color: #7dd3fc;
            margin-bottom: 12px;
        }

        .description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #e0f2fe;
        }

        input[list] {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid #334e68;
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-size: 16px;
            transition: 0.3s ease;
        }

        input[list]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
        }

        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: #94a3b8;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🥤</div>

        <h1>Datalist Test</h1>

        <p class="description">
            Choose your favorite drink from the suggestions
            or type your own choice in the field below.
        </p>

        <form action="#" method="get">

            <label for="drink">Drinks</label>

            <input
                type="text"
                id="drink"
                name="drink"
                list="soda"
                placeholder="Choose or type a drink..."
                autocomplete="off"
            >

            <datalist id="soda">
                <option value="Coke">
                <option value="Pepsi">
                <option value="Dr. Pepper">
                <option value="Mr. Pibb">
                <option value="Mt. Dew">
                <option value="7-Up">
            </datalist>

            <p class="hint">
                💡 Start typing to see available suggestions.
            </p>

            <button type="submit">Submit Drink</button>

        </form>

        <div class="footer">
            HTML5 &amp; CSS3 | Datalist Example
        </div>

    </div>

</body>
</html>
