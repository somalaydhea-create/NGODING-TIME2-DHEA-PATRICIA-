<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>CSS Color Values</title>

<style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        padding: 35px 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #171717, #302020, #481b24);
        color: white;
    }

    .container {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
        padding: 30px;
        background: #242020;
        border: 1px solid #57353a;
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .color-box {
        margin-top: 18px;
        padding: 22px;
        border-radius: 12px;
        color: white;
        font-size: 17px;
        font-weight: bold;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
    }

    .color-box:hover {
        transform: translateX(7px);
    }

    .red {background-color: #FF0000;}
    .red2 {background-color: #F00;}
    .red3 {background-color: red;}
    .red4 {background-color: rgb(255, 0, 0);}
    .red5 {background-color: hsl(0, 100%, 50%);}

    @media (max-width: 500px) {
        .container {
            padding: 20px;
        }

        .color-box {
            padding: 18px;
            font-size: 15px;
        }
    }
</style>
</head>

<body>
<div class="container">

    <div class="color-box red">
        .red {background-color: #FF0000;}
    </div>

    <div class="color-box red2">
        .red2 {background-color: #F00;}
    </div>

    <div class="color-box red3">
        .red3 {background-color: red;}
    </div>

    <div class="color-box red4">
        .red4 {background-color: rgb(255, 0, 0);}
    </div>

    <div class="color-box red5">
        .red5 {background-color: hsl(0, 100%, 50%);}
    </div>

</div>
</body>
</html>
