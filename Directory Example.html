<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #12372a, #436850, #adbc9f);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            background: #fffdf5;
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        ul {
            list-style: none;
        }

        li {
            position: relative;
            margin: 14px 0;
            padding: 18px 20px 18px 52px;
            color: #254d3b;
            background: #edf4e8;
            border: 1px solid #d5e4ce;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        li::before {
            content: "✦";
            position: absolute;
            left: 20px;
            color: #4d8060;
            font-size: 19px;
        }

        li:hover {
            transform: translateX(8px);
            background: #dcebd5;
            border-color: #6b9b76;
            box-shadow: 0 8px 18px rgba(37, 77, 59, 0.12);
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            li {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <dir>
            <li>Header Files</li>
            <li>Code Files</li>
            <li>Comment Files</li>
        </dir>
    </div>
</body>
</html>
