<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>

    <style type="text/css">
        .box {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: orange;
            border-radius: 12px;

            -webkit-animation: move 5s infinite;
            animation: move 5s infinite;
        }

        @-webkit-keyframes move {
            from {
                left: 0;
                top: 0;
                opacity: 1;
            }

            50% {
                left: 500px;
                top: 0;
                opacity: 1;
            }

            to {
                left: 500px;
                top: 500px;
                opacity: 1;
            }
        }

        @keyframes move {
            from {
                left: 0;
                top: 0;
                opacity: 1;
            }

            50% {
                left: 500px;
                top: 0;
                opacity: 1;
            }

            to {
                left: 500px;
                top: 500px;
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>
</html>
