
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our High-Priced Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020b1c, #092650, #124a7c);
            padding: 20px;
        }

        .table-container {
            width: 100%;
            max-width: 800px;
            padding: 35px;
            background: rgba(209, 58, 255, 0.95);
            border: 1px solid rgba(94, 203, 255, 0.35);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #3da9fc;
            overflow: hidden;
        }

        caption {
            caption-side: top;
            padding: 20px 10px;
            color: #5ecbff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(94, 203, 255, 0.4);
        }

        td {
            padding: 25px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #eaf6ff;
            background: #000f5b;
            border: 1px solid #28669a;
            transition: all 0.3s ease;
        }

        tr td:nth-child(2) {
            background: #10365f;
        }

        td:hover {
            background: #1769aa;
            color: #ffffff;
            box-shadow: inset 0 0 18px rgba(94, 203, 255, 0.25);
        }

        @media (max-width: 600px) {
            .table-container {
                padding: 15px;
            }

            caption {
                font-size: 22px;
            }

            td {
                padding: 18px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="table-container">

        <table border="1">

            <caption align="top">Our High-Priced Menu</caption>

            <tr>
                <td>Escargot</td>
                <td>Filet Mignon</td>
                <td>Big Mac</td>
            </tr>

        </table>

    </div>

</body>
</html>
