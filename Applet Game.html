<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Applet Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .game-card {
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .game-title {
            margin-bottom: 20px;
            color: #243b55;
            font-size: 26px;
            font-weight: bold;
        }

        .game-box {
            width: 350px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #f77ec2, #764ba2);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        applet {
            border-radius: 15px;
            overflow: hidden;
        }

        strong {
            color: white;
            font-size: 16px;
            line-height: 1.6;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="game-card">

        <div class="game-title">Java Game</div>

        <div class="game-box">

            <applet code="atarigame.class" align="left" archive="game.zip" 
            height="250" width="350"> 
                <param name="difficulty" value="easy"> 
                <strong>Sorry, you need Java to play this game.</strong> 
            </applet>

        </div>

    </div>

</body>
</html>
