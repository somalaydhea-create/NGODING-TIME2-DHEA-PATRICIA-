<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Embedded Styles</title>

<style type="text/css" media="all">
<!--
* {
    box-sizing: border-box;
}

body {
    font-size: medium;
    font-family: Serif;
    background: linear-gradient(135deg, #171717, #35312d, #5c4535);

    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#page {
    background-color: #fffaf0;
    color: #292521;
    padding: 2.5em;
    width: 100%;
    max-width: 850px;
    border-radius: 16px;

    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);

h1 {
    font-size: xx-large;
    font-family: Sans-Serif;
    color: #292521;
    text-align: center;
    border-bottom: solid 4px orange;
    padding-bottom: 18px;
    margin-top: 0;
    margin-bottom: 28px;
}

p {
    text-indent: 1em;
    text-align: justify;
    line-height: 150%;
    font-size: 18px;
    margin-bottom: 0;
}

a:link {
    color: #a64b00;
    text-decoration: none;
    font-weight: bold;
}

a:visited {
    color: #8b3a3a;
    text-decoration: none;
}

a:hover {
    color: #d35400;
    text-decoration: underline;
}

a:active {
    color: #c0392b;
    text-decoration: none;
}

@media (max-width: 500px) {
    #page {
        padding: 1.5em;
    }

    h1 {
        font-size: 26px;
    }

    p {
        font-size: 16px;
    }
}
-->
</style>
</head>

<body>
<div id="page">
<h1>HTML with Embedded Style</h1>
<p>Cascading Style Sheets 2.1 as defined by the
<a href="http://www.w3.org">W3C</a> provides
powerful page layout facilities. The technology
depends on correct markup so make sure
you get that right too!</p>
</div>
</body>
</html>
