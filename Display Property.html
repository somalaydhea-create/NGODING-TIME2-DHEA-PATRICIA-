<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>

    <style type="text/css">
        #p1 {display: inline;} /* run this element as an inline */

        b {display: block;}

        .navigation {display: none;}
        /* consider turning off items in a print style */
    </style>
</head>
<body>

    <h2>Display Property</h2>

    <p id="p1">This element uses inline display.</p>

    <p>
        This is a paragraph with
        <b>bold text displayed as block.</b>
        This is the next text.
    </p>

    <div class="navigation">
        Home | About | Contact
    </div>

    <p>Another paragraph appears here.</p>

</body>
</html>
